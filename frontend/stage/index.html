<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DriveOn 시연 무대</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;600;800&display=swap" />
  <link rel="stylesheet" href="/common/theme.css" />
  <style>
    body { display: grid; grid-template-rows: auto 62vh 1fr; height: 100vh; gap: 8px; padding: 8px; }
    .bar { display: flex; gap: 12px; align-items: center; font-size: 13px; }
    .bar b { font-size: 15px; }
    .bar a { color: var(--text); }
    iframe { width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
    .bottom { display: grid; grid-template-columns: 1.15fr 1fr; gap: 8px; min-height: 0; }
    @media (max-width: 900px) {
      body { height: auto; grid-template-rows: auto 900px auto; }
      .bottom { grid-template-columns: 1fr; grid-auto-rows: 520px; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <b>DriveOn 시연 무대</b>
    <span class="muted">차량 화면 · 매장 POS · 데모 패널을 한 화면에 — 시연 영상 녹화용</span>
    <span style="margin-left:auto">따로 열기:
      <a href="/car/" target="_blank">차량</a> ·
      <a href="/pos/" target="_blank">POS</a> ·
      <a href="/demo/" target="_blank">데모 패널</a> · <a href="/tour/">UI 둘러보기</a> · <a href="/voice/" target="_blank">음성 콘솔</a></span>
  </div>
  <iframe src="/car/" title="차량 화면" allow="microphone"></iframe>
  <div class="bottom">
    <iframe src="/pos/" title="매장 POS 시뮬레이터"></iframe>
    <iframe src="/demo/" title="데모 컨트롤 패널"></iframe>
  </div>
</body>
</html>
